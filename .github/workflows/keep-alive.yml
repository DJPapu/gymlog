name: Keep Supabase alive

on:
  schedule:
    - cron: '0 8 */3 * *'   # cada 3 días a las 8:00 UTC
  workflow_dispatch:          # también ejecutable a mano

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: |
          curl -sf "${{ secrets.BACKEND_URL }}/health" || echo "Backend no disponible (normal en cold start)"
