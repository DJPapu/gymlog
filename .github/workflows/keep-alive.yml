name: Keep alive (Supabase + Render)

on:
  schedule:
    - cron: '0 8 */3 * *'   # cada 3 días a las 8:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          curl -sf "https://gymlog-5y6y.onrender.com/health" || echo "Backend en cold start, reintentando..."
          sleep 60
          curl -sf "https://gymlog-5y6y.onrender.com/health" || echo "Backend no disponible"
